/* Kiosk-App: FHGR-CI-Farben bleiben in hellem und dunklem Modus gleich. */
:root{
  color-scheme: light;
  --graphite:#38484E; --lagoon:#008C80; --lagoon-d:#00706A; --lagoon-l:#7FD1C7; --ruby:#D61E38;
  --silver:#EEF3F5; --ink:#111518; --line:#D5DDE0; --line2:#C9D3D7; --mute:#38484E; --mute2:#5B6B71; --white:#FFFFFF;
  --frame-light:#EEF3F5; --frame-dark:#38484E;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --frame-light:#E3E9EC; --frame-dark:#2F3D42; } }
:root[data-theme="dark"]{ --frame-light:#E3E9EC; --frame-dark:#2F3D42; }

html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--frame-light);color:var(--ink);font-family:'Roboto','Helvetica Neue',Arial,sans-serif;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.dark{background:var(--frame-dark)}
#app{position:fixed;inset:0;overflow:hidden;padding:env(safe-area-inset-top) max(env(safe-area-inset-right),0px) env(safe-area-inset-bottom) max(env(safe-area-inset-left),0px)}
#stage{position:absolute;left:50%;top:50%;width:1180px;height:820px;transform:translate(-50%,-50%);overflow:hidden;background:var(--silver);color:var(--ink)}
#screen{position:absolute;inset:0}
#app img{display:block;-webkit-user-drag:none;pointer-events:none}
svg{display:block;flex:none}
button{font-family:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer;color:inherit;margin:0}
button:active{filter:brightness(0.9)}
input,textarea{font-family:inherit;-webkit-user-select:text;user-select:text}

.scr{position:absolute;inset:0;box-sizing:border-box;padding:56px 72px;display:flex;flex-direction:column}
.scr.dark{background:var(--graphite);color:var(--white);padding:64px 72px}

/* Kopf */
.hdr{height:48px;display:flex;align-items:center;justify-content:space-between;flex:none}
.brand{display:flex;align-items:center;gap:12px;font-size:18px;line-height:22px;font-weight:500}
.brand img{width:36px;height:36px}
.brand-l{display:flex;align-items:center;gap:14px;align-self:flex-start}
.brand-l img{width:48px;height:48px}
.b1{font-size:18px;line-height:22px;font-weight:500}
.b2{font-size:16px;line-height:20px;font-weight:300;color:var(--line2)}
.prog{display:flex;align-items:center;gap:14px;font-size:18px;line-height:22px;color:var(--mute)}
.segs{display:flex;gap:6px}
.seg{width:48px;height:6px;border-radius:3px;display:block;background:var(--line2)}
.seg.on{background:var(--lagoon)}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 6px;background:transparent;border:0;font-size:20px;line-height:24px;color:var(--mute)}
.hstat{font-size:18px;line-height:22px;color:var(--mute)}

/* Pfad */
.crumbs{margin-top:24px;min-height:36px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:none}
.crumbs .cl{font-size:16px;line-height:20px;color:var(--mute);margin-right:2px}
.crumbs .hint{font-size:16px;line-height:20px;color:var(--mute2);font-style:italic}
.crumb{font-size:16px;line-height:20px;font-weight:500;color:var(--white);background:var(--graphite);border:0;border-radius:16px;padding:6px 14px}

/* Fragen */
.qh{margin:24px 0 0;font-size:52px;line-height:60px;font-weight:300;letter-spacing:-0.01em}
.qs{margin:6px 0 0;font-size:22px;line-height:30px;color:var(--mute)}
.grid{margin-top:20px;display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{box-sizing:border-box;display:flex;background:var(--white);border:1px solid var(--line);border-radius:8px;text-align:left;color:var(--ink);transition:background-color .12s ease,color .12s ease}
.tile .tt,.tile .ts,.tile .tg{display:block}
.tile.sel{box-shadow:inset 0 0 0 3px var(--lagoon)}
.tile:active,.tile.hit{background:var(--graphite) !important;color:var(--white) !important;filter:none !important}
.tile:active span,.tile.hit span{color:var(--white) !important}
.t-tall{height:280px;flex-direction:column;justify-content:flex-end;gap:10px;padding:28px}
.t-rolle .tt{font-size:30px;line-height:36px;font-weight:500;text-wrap:balance}
.t-rolle .ts{font-size:19px;line-height:26px;color:var(--mute);text-wrap:pretty}
.t-welt{height:160px;flex-direction:column;justify-content:center;gap:8px;padding:22px 26px}
.t-welt .tt{font-size:28px;line-height:34px;font-weight:500}
.t-welt .ts{font-size:17px;line-height:23px;color:var(--mute);text-wrap:pretty}
.t-flat{height:160px;align-items:center;padding:0 28px}
.t-branche .tt{font-size:30px;line-height:36px;font-weight:400}
.t-baustelle .tt{font-size:28px;line-height:36px;font-weight:400;text-wrap:balance}
.t-richtung .tt{font-size:28px;line-height:34px;font-weight:500;text-wrap:balance}
.t-richtung .ts{font-size:18px;line-height:24px;color:var(--mute);text-wrap:pretty}
.t-richtung .tg{margin-top:8px;font-size:13px;line-height:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--lagoon-d)}
.qfoot{margin-top:auto;padding-top:20px;display:flex;align-items:center;gap:20px}
.qfoot span{font-size:18px;line-height:24px;color:var(--mute)}

/* Knöpfe */
.btn-p{display:inline-flex;align-items:center;gap:12px;min-height:64px;box-sizing:border-box;padding:0 28px;background:var(--lagoon);color:var(--white);border:0;font-size:24px;line-height:30px;font-weight:500;border-radius:6px}
.btn-s{display:inline-flex;align-items:center;gap:12px;min-height:64px;box-sizing:border-box;padding:0 24px;background:var(--white);border:2px solid var(--graphite);color:var(--graphite);font-size:22px;line-height:28px;font-weight:500;border-radius:6px}
.btn-dice{min-height:58px;padding:0 26px;font-size:22px}
.btn-go{display:inline-flex;align-items:center;gap:14px;background:var(--lagoon);color:var(--white);border:0;font-size:26px;line-height:32px;font-weight:500;padding:22px 36px;border-radius:6px}
.btn-w{display:inline-flex;align-items:center;gap:12px;background:var(--white);color:var(--graphite);border:0;font-size:22px;line-height:28px;font-weight:500;padding:18px 28px;border-radius:6px}
.btn-link{display:inline-flex;align-items:center;min-height:64px;padding:0 18px;background:transparent;border:0;color:var(--mute);text-decoration:underline;font-size:20px;line-height:26px}

/* Start */
.start{flex-direction:row;align-items:center;gap:56px}
.st-left{flex:1;min-width:0;height:100%;display:flex;flex-direction:column}
.st-mid{margin-top:auto;display:flex;flex-direction:column;gap:20px}
.st-boxes{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-bottom:6px}
.st-lab{font-size:22px;line-height:28px;font-weight:300;color:#111518;background:#FFFFFF;padding:2px 10px 3px}
.st-nb{font-size:44px;line-height:52px;font-weight:300;color:#FFFFFF;background:var(--lagoon);padding:2px 14px 4px}
.st-mid h1{margin:0;font-size:48px;line-height:54px;font-weight:300;letter-spacing:-0.015em;text-wrap:balance}
.st-mid p{margin:0;font-size:24px;line-height:34px;font-weight:300;color:#DCE4E7;max-width:480px;text-wrap:pretty}
.st-cta{margin-top:30px}
.btn-circle{width:150px;height:150px;border-radius:50%;background:var(--ruby);color:#FFFFFF;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:25px;line-height:30px;font-weight:500;box-shadow:0 14px 30px rgba(0,0,0,.28)}
.st-foot{margin-top:auto;padding-top:32px;font-size:18px;line-height:24px;color:#B9C6CB}
.st-cards{flex:none;width:480px;height:640px;position:relative}
.fan{position:absolute;left:-40px;width:559px;height:397px;border-radius:4px;overflow:hidden}
.fan1{top:30px;transform:rotate(5deg) scale(.78);box-shadow:0 24px 50px rgba(10,20,24,.5)}
.fan2{top:230px;transform:rotate(-4deg) scale(.78);box-shadow:0 30px 60px rgba(10,20,24,.55),0 6px 14px rgba(10,20,24,.3)}
.vtag{position:absolute;right:24px;bottom:18px;font-size:13px;line-height:16px;color:rgba(255,255,255,.45)}
.logo-hit{-webkit-tap-highlight-color:transparent}

/* Ergebnis */
.erg-body{flex:1;min-height:0;display:flex;align-items:center;gap:56px}
.erg-card{flex:none;box-shadow:0 24px 48px rgba(17,21,24,.18),0 4px 10px rgba(17,21,24,.12);border-radius:4px;overflow:hidden}
.erg-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.erg-tag{font-size:16px;line-height:20px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--lagoon-d)}
.erg-txt h1{margin:14px 0 0;font-size:48px;line-height:54px;font-weight:300;letter-spacing:-0.01em;text-wrap:balance}
.erg-txt p{margin:16px 0 0;font-size:20px;line-height:30px;color:var(--mute);text-wrap:pretty}
.erg-btns{margin-top:28px;display:flex;flex-wrap:wrap;gap:14px}
.erg-note{margin-top:32px;padding-top:20px;border-top:1px solid var(--line2);font-size:18px;line-height:27px;color:var(--mute);text-wrap:pretty}
.testpill{margin-bottom:18px;padding:10px 14px;background:#FBE9EC;border-left:4px solid var(--ruby);font-size:15px;line-height:21px;color:var(--ink);text-wrap:pretty}
.testpill b{font-weight:500;color:var(--ruby)}

/* Druck & E-Mail */
.dr-stat{display:flex;align-items:center;gap:12px;color:var(--lagoon-d);font-size:18px;line-height:22px;font-weight:500}
.dr-bar{width:160px;height:6px;border-radius:3px;background:var(--line2);display:block;overflow:hidden;position:relative}
.dr-bar i{position:absolute;top:0;left:-40%;width:40%;height:6px;background:var(--lagoon);display:block;animation:slide 1.6s ease-in-out infinite}
@keyframes slide{0%{left:-40%}100%{left:100%}}
.dr-body{flex:1;min-height:0;display:flex;align-items:center;gap:64px;margin:0}
.dr-left{flex:1;min-width:0;display:flex;flex-direction:column}
.dr-left h1{margin:0;font-size:52px;line-height:60px;font-weight:300;letter-spacing:-0.01em}
.dr-lead{margin:14px 0 0;font-size:22px;line-height:32px;color:var(--mute);max-width:600px;text-wrap:pretty}
.dr-lbl{margin-top:30px;font-size:18px;line-height:24px;font-weight:500}
.dr-in{margin-top:8px;width:100%;max-width:600px;height:64px;box-sizing:border-box;padding:0 20px;font-size:24px;color:var(--ink);background:var(--white);border:2px solid var(--graphite);border-radius:6px;outline:none;-webkit-appearance:none;appearance:none}
.dr-in:focus{border-color:var(--lagoon);box-shadow:0 0 0 3px rgba(0,140,128,.2)}
.dr-in.bad{border-color:var(--ruby)}
.dr-err{min-height:22px;margin-top:6px;font-size:17px;line-height:22px;color:var(--ruby);font-weight:500}
.dr-chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 16px;background:var(--white);border:1px solid var(--line);border-radius:22px;font-size:18px;line-height:22px;color:var(--graphite)}
.dr-ck{margin-top:18px;display:flex;align-items:flex-start;gap:12px;max-width:600px;font-size:19px;line-height:28px;text-wrap:pretty}
.dr-ck input{width:28px;height:28px;margin:0;flex:none;accent-color:var(--lagoon)}
.dr-ck .m{color:var(--mute)}
.dr-btns{margin-top:24px;display:flex;align-items:center;gap:14px}
.dr-priv{margin:18px 0 0;font-size:16px;line-height:23px;color:var(--mute);max-width:600px;text-wrap:pretty}
.dr-ill{flex:none;width:360px;height:420px;position:relative}
.dr-ill .fan{left:-100px;top:12px;transform:rotate(4deg) scale(.62);box-shadow:0 24px 48px rgba(17,21,24,.22)}
.dr-badge{position:absolute;right:18px;top:52px;font-size:16px;line-height:20px;font-weight:500;color:var(--white);background:var(--ruby);border-radius:4px;padding:6px 12px}
.kb .dr-body{align-items:flex-start;padding-top:20px}
.kb .dr-left h1{font-size:40px;line-height:46px}
.kb .dr-lead,.kb .dr-ill{display:none}
.kb .dr-lbl{margin-top:18px}

/* Vorname */
.nm-body{flex:1;min-height:0;display:flex;align-items:flex-start;gap:56px;margin:0;padding-top:28px}
.nm-left{flex:1;min-width:0;display:flex;flex-direction:column}
.nm-left h1{margin:0;font-size:52px;line-height:60px;font-weight:300;letter-spacing:-0.01em}
.nm-lead{margin:12px 0 0;font-size:22px;line-height:32px;color:var(--mute);max-width:520px;text-wrap:pretty}
.nm-row{margin-top:8px;display:flex;gap:12px;max-width:600px}
.nm-row .dr-in{margin-top:0;flex:1;min-width:0;font-size:28px}
.nm-skip{margin-top:12px;align-self:flex-start;padding:0 6px}
.nm-card{flex:none;width:447px;display:flex;flex-direction:column;gap:12px}
.nm-scale{width:447px;height:318px;border-radius:4px;overflow:hidden;box-shadow:0 18px 40px rgba(17,21,24,.16),0 3px 8px rgba(17,21,24,.1)}
.nm-scale .karte{transform:scale(.8);transform-origin:0 0}
.nm-cap{font-size:15px;line-height:20px;color:var(--mute)}

/* Danke */
.dk-mid{margin:auto 0;display:flex;flex-direction:column;gap:20px;max-width:780px}
.dk-mid h1{margin:0;font-size:62px;line-height:68px;font-weight:300;letter-spacing:-0.015em;text-wrap:balance}
.dk-mid p{margin:0;font-size:24px;line-height:34px;font-weight:300;color:#DCE4E7;text-wrap:pretty}
.dk-foot{display:flex;align-items:center;gap:24px}
.dk-foot span{font-size:17px;line-height:22px;color:#B9C6CB}

/* Leerlauf */
.ov{position:absolute;inset:0;background:rgba(17,21,24,.72);display:flex;align-items:center;justify-content:center;z-index:5}
.ov[hidden]{display:none}
.ov-box{width:560px;box-sizing:border-box;padding:40px 44px;background:var(--white);border-radius:10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.ov-h{font-size:44px;line-height:50px;font-weight:300}
.ov-box p{margin:0;font-size:21px;line-height:30px;color:var(--mute)}
.ov-n{margin-top:6px;width:84px;height:84px;border-radius:50%;background:var(--graphite);color:var(--white);font-size:38px;line-height:84px;font-weight:300}

/* Admin */
.adm{padding:36px 48px;gap:18px;overflow:hidden}
.adm-h{display:flex;align-items:center;justify-content:space-between;gap:20px}
.adm-h h1{margin:0;font-size:34px;line-height:40px;font-weight:400}
.adm-h .sub{font-size:15px;line-height:20px;color:var(--mute)}
.warn{padding:10px 14px;border-left:4px solid var(--ruby);background:#FBE9EC;font-size:15px;line-height:21px}
.note{padding:10px 14px;border-left:4px solid var(--lagoon);background:var(--white);font-size:15px;line-height:21px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:12px 16px}
.kpi b{display:block;font-size:32px;line-height:38px;font-weight:400;font-variant-numeric:tabular-nums}
.kpi span{font-size:14px;line-height:18px;color:var(--mute)}
.adm-cols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px}
.panel{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-height:0}
.panel h2{margin:0;font-size:13px;line-height:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--lagoon-d)}
.list{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line)}
.li{display:grid;grid-template-columns:96px minmax(0,1fr) 66px 34px;gap:10px;padding:8px 0;border-bottom:1px solid #E3E9EC;font-size:15px;line-height:20px;align-items:baseline}
.li .e{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t,.li .n{color:var(--mute);font-variant-numeric:tabular-nums}
.empty{padding:14px 0;color:var(--mute2);font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ab{min-height:48px;padding:0 16px;border-radius:6px;border:2px solid var(--graphite);background:var(--white);color:var(--graphite);font-size:17px;line-height:22px;font-weight:500}
.ab.p{background:var(--graphite);color:var(--white)}
.ab.red{border-color:var(--ruby);color:var(--ruby)}
.ab.red.arm{background:var(--ruby);color:var(--white)}
.set{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px;align-items:center;font-size:16px;line-height:20px}
.set>span{color:var(--mute)}
.seg2{display:inline-flex;border:2px solid var(--graphite);border-radius:6px;overflow:hidden}
.seg2 button{min-height:44px;padding:0 14px;border:0;background:var(--white);color:var(--graphite);font-size:16px;font-weight:500}
.seg2 button+button{border-left:2px solid var(--graphite)}
.seg2 button.on{background:var(--graphite);color:var(--white)}
.stp{display:flex;align-items:center;gap:8px}
.stps{display:flex;flex-direction:column;gap:8px}
.hintline{font-size:14px;line-height:19px;color:var(--mute)}
.stp button{width:44px;height:44px;border:2px solid var(--graphite);border-radius:6px;background:var(--white);color:var(--graphite);font-size:22px;line-height:20px}
.stp span{min-width:98px}
.stp b{min-width:76px;text-align:center;font-weight:500;font-variant-numeric:tabular-nums}
.csv{width:100%;height:120px;box-sizing:border-box;font-size:12px;line-height:16px;font-family:ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:4px;padding:8px}

/* Karte (Rückseite) · passend zur gedruckten Vorderseite, druckt ganz, mit Rand für den Drucker */
.karte{width:559px;height:397px;box-sizing:border-box;padding:16px 18px;background:#FFFFFF;color:#111518;font-family:'Roboto','Helvetica Neue',Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden;text-align:left;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.k-in{display:flex;flex-direction:column}
.k-top{display:flex;gap:18px;align-items:flex-start}
.k-main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.k-tag{font-size:12px;line-height:15px;font-weight:400;color:#111518;background:#EEF3F5;padding:2px 7px 3px;box-shadow:inset 0 0 0 1px #DCE4E7}
.k-name{margin:0;font-size:24px;line-height:30px;font-weight:400;letter-spacing:-0.005em;color:#FFFFFF;background:#008C80;padding:1px 10px 2px}
.k-ctx{margin-top:7px;font-size:11px;line-height:14px;color:#38484E;text-wrap:pretty}
.k-ctx .sep{color:#8A989D}
.k-ein{margin:6px 0 0;font-size:13px;line-height:17px;font-weight:300;text-wrap:pretty}
.k-rate{width:158px;flex:none;display:flex;flex-direction:column;gap:4px}
.k-nrl{margin-bottom:6px;font-size:10.5px;line-height:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#00706A}
.k-lbl{font-size:11px;line-height:14px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#38484E}
.k-row{display:flex;justify-content:space-between;align-items:center;height:16px;font-size:12px;color:#111518}
.dots{display:flex;gap:4px}
.dot{width:9px;height:9px;border-radius:50%;background:#D5DDE0;display:block}
.dot.on{background:#008C80}
.k-risk{margin:8px 0 0;font-size:12.5px;line-height:16px;text-wrap:pretty}
.k-risk b{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#D61E38}
.k-plbl{margin-top:10px}
.k-pfad{margin-top:7px;position:relative}
.k-line{position:absolute;left:11px;right:100px;top:10px;height:2px;background:#C9D3D7}
.k-st{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.k-s{display:flex;flex-direction:column;gap:5px}
.k-n{width:22px;height:22px;border-radius:50%;background:#008C80;color:#FFFFFF;font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center}
.k-n.praxis{background:#D61E38}
.k-m{font-size:12.5px;line-height:15px;font-weight:500}
.k-t{font-size:11.5px;line-height:14.5px;color:#38484E;text-wrap:pretty}
.k-panel{margin-top:auto;display:flex;flex-direction:column}
.k-slope{height:0;width:0;border-style:solid;border-width:0 0 16px 523px;border-color:transparent transparent #E6ECEF transparent;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.k-pbody{background:#E6ECEF;padding:6px 12px 8px;display:flex;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.k-pin{position:relative;flex:1;min-width:0;display:flex;flex-direction:column}
.k-gruss{font-size:12.5px;line-height:16px;color:#00706A;text-wrap:pretty}
.k-gruss b{font-weight:500}
.k-cta1{margin-top:3px;font-size:15px;line-height:18px;font-weight:500;color:#111518}
.k-kon{margin-top:3px;display:flex;flex-direction:column;font-size:11px;line-height:13.5px;color:#38484E}
.k-ki{position:relative;flex:none;font-size:10.5px;line-height:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#00706A;text-align:right}
/* Notbremse, falls ein Browser anders umbricht */
.karte.fit1 .k-risk{margin-top:6px}
.karte.fit1 .k-plbl{margin-top:8px}
.karte.fit1 .k-pfad{margin-top:6px}
.karte.fit1 .k-pbody{padding-top:4px}
.karte.fit1 .k-ein{margin-top:4px}
.karte.fit2 .k-ein{font-size:12.5px;line-height:16px}
.karte.fit2 .k-t{font-size:11px;line-height:13.5px}
.karte.fit2 .k-risk{line-height:15px}
.karte.fit3 .k-name{font-size:22px;line-height:27px}
.karte.fit3 .k-m{font-size:12px;line-height:14px}
.karte.fit3 .k-s{gap:4px}

#measure,#shot{position:absolute;left:-10000px;top:0;visibility:hidden;pointer-events:none}
#print{display:none}
@page{size:148mm 105mm;margin:0}
@media print{
  html,body{width:148mm;height:105mm;margin:0 !important;padding:0 !important;background:#FFFFFF !important;overflow:hidden}
  #app,#measure,#shot{display:none !important}
  #print{display:block;width:148mm;height:104mm;overflow:hidden;position:relative}
  #print .karte{width:148mm;height:104mm;transform:translate(var(--dx,0mm),var(--dy,0mm))}
}

n."], "m": [3, "Fahrzeug, Personal und Bewilligungen brauchen Vorlauf."], "r": [2, "Ohne Beiträge der öffentlichen Hand schwer finanzierbar."]}, "pfad": [["Business Innovation", "Versorgungsmodell für die Täler entwerfen"], ["Supply Chain Management", "Fahrplan und Einsätze planen"], ["Risk Management", "Tarife, Haftung und Bewilligungen klären"]], "praxis": {"angestellt": "Probetag mit deiner Praxis oder deinem Spital", "inhaber": "Probetag in einem Tal deiner Region", "frei": "Probetag mit einer Gemeinde planen"}, "morgen": {"angestellt": "Frag am Empfang, aus welchen Tälern die Patientinnen und Patienten am weitesten anreisen.", "inhaber": "Ruf eine Gemeinde ohne Praxis an und frag, wie die Leute heute versorgt werden.", "frei": "Finde heraus, in welchen Bündner Tälern es keine Hausarztpraxis mehr gibt."}, "weitere": [["Data Management", "Patientendaten mobil und sicher führen"], ["Corporate Communication", "Vertrauen bei Bevölkerung und Gemeinde aufbauen"]]}, {"branche": "gesundheit", "baustelle": 2, "richtung": "transformation", "name": "Gruppenpraxis Tal", "einzeiler": "Die Hausarztpraxis im Tal wird zur Gruppenpraxis mit angestellten Ärztinnen in Teilzeit.", "problem": "Im Prättigau, in der Surselva oder im Puschlav gehen Hausärzte in Pension, ohne dass jemand die Praxis kauft. Junge Ärztinnen und Ärzte wollen angestellt und in Teilzeit arbeiten, nicht allein eine Praxis führen.", "geld": "Die Praxis rechnet weiter über die Tarife ab. Gemeinden oder das Regionalspital tragen Räume und Verwaltung, die Ärztinnen erhalten Lohn statt Unternehmerrisiko.", "risiko": "Auch für Teilzeitstellen ziehen viele junge Ärztinnen die Stadt dem Tal vor.", "test": "Mit einem Hausarzt kurz vor der Pension das Modell skizzieren und drei Ärztinnen in Weiterbildung fragen, ob sie zwei Tage pro Woche im Tal arbeiten würden. Erfolg: eine will die Praxis anschauen.", "rating": {"e": [4, "Gemeinden und Patienten wollen die Praxis im Tal halten."], "m": [3, "Trägerschaft, Kaufpreis und Personal brauchen viele Gespräche."], "r": [3, "Trägt sich bei guter Auslastung, sonst zahlen die Gemeinden mit."]}, "pfad": [["Business Transformation", "Trägerschaft und Übergabe planen"], ["Organisational Development", "Gruppenpraxis mit Teilzeitteam aufbauen"], ["Corporate Communication", "Patienten und Gemeinden mitnehmen"]], "praxis": {"angestellt": "Nachfolgemodell für eine Praxis deiner Region", "inhaber": "Übergabe deiner Praxis an eine Trägerschaft", "frei": "Praxisübernahme mit Gemeinde und Spital planen"}, "morgen": {"angestellt": "Finde heraus, welche Hausärzte in deiner Region in den nächsten fünf Jahren 65 werden.", "inhaber": "Frag zwei junge Ärztinnen, unter welchen Bedingungen sie in deiner Praxis arbeiten würden.", "frei": "Ruf eine Gemeindekanzlei im Tal an und frag, wer die Hausarztpraxis nach der Pensionierung übernimmt."}, "weitere": [["Leading Change", "Den bisherigen Hausarzt in den Wandel einbinden"], ["Data Management", "Patientendossiers sauber übergeben"]]}, {"branche": "gesundheit", "baustelle": 2, "richtung": "international", "name": "Facharzt-Brücke", "einzeiler": "Fachärzte aus Veltlin und Vinschgau halten Sprechtage im Puschlav und in der Val Müstair.", "problem": "Wer im Puschlav oder in der Val Müstair eine Augenärztin oder einen Kardiologen braucht, fährt oft über eine Stunde nach Samedan oder Chur. Im Veltlin oder im Vinschgau, eine halbe Stunde entfernt, gibt es diese Fachleute.", "geld": "Das Gesundheitszentrum im Tal stellt die Fachärzte tageweise an und rechnet über die Schweizer Tarife ab. Es füllt freie Räume, die Patienten sparen lange Wege.", "risiko": "Bewilligung und Zulassung für ausländische Fachärzte sind aufwendig und dauern.", "test": "Die Überweisungen des letzten Jahres nach Fachgebiet auszählen und zwei Fachärzte in Tirano oder Schlanders anrufen. Erfolg: ein Fachgebiet mit genug Fällen für einen Sprechtag im Monat und ein Arzt, der Ja sagt.", "rating": {"e": [4, "Lange Wege für Kontrollen ärgern die Menschen function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function pad3(n) { return ('00' + n).slice(-3); }
function byId(list, id) { for (var k = 0; k < list.length; k++) if (list[k].id === id) return list[k]; return null; }
function weltOf(b) { for (var k = 0; k < WELTEN.length; k++) if (WELTEN[k].branchen.indexOf(b) >= 0) return WELTEN[k]; return null; }

function findIdea(b, bs, r) {
  var n = nrOf(b, bs, r);
  if (BY_NR[n]) return { idea: BY_NR[n], exact: true, nr: n };
  var w = weltOf(b), best = null, score = -1;
  IDEEN.forEach(function (i) {
    var s = (i.branche === b ? 100 : 0) + (weltOf(i.branche) === w ? 10 : 0) + (i.richtung === r ? 5 : 0) + (i.baustelle === bs ? 1 : 0);
    if (s > score) { score = s; best = i; }
  });
  return { idea: best, exact: false, nr: n };
}

  return k.querySelector('.k-in').offsetHeight + k.querySelector('.k-panel').offsetHeight + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) + 4;
}
function fitCard(root) {
  var k = root.querySelector('.karte'); if (!k) return;
  k.classList.remove('fit1', 'fit2', 'fit3');
  if (needH(k) > CARD_H) k.classList.add('fit1');
  if (needH(k) > CARD_H) k.classList.add('fit2');
  if (needH(k) > CARD_H) k.classList.add('fit3');
}
function fillPrint(i, role, name) {
  var m = document.getElementById('measure');
  m.innerHTML = cardHTML(i, role, name);
  fitCard(m);
  document.getElementById('print').innerHTML = m.innerHTML;
  m.innerHTML = '';
}
function applyOffset() {
  var p = document.getElementById('print');
  p.style.setProperty('--dx', settings.dx + 'mm');
  p.style.setProperty('--dy', settings.dy + 'mm');
}

var S;

  return { screen: 'start', name: '', rolle: null, welt: null, branche: null, baustelle: null, richtung: null,
    pressed: null, result: null, runIdx: -1, mail: '', kontakt: false, err: '', sent: false,
    showCsv: '', armWipe: false, flash: '' };
}
S = fresh();
var busy = false, lastTap = 0;
function guard() { var n = Date.now(); if (busy || n - lastTap < 450) return false; lastTap = n; return true; }
function apply(patch) {
  var prev = S.screen;
  Object.assign(S, patch);
  if (S.screen === 'ergebnis' && prev !== 'ergebnis') enterErgebnis();
  render();
}
function go(patch) { if (!guard()) return; apply(patch); }
function press(key, patch, delay) {
  if (!guard()) return;
  busy = true; S.pressed = key; render();
  setTimeout(function () { busy = false; S.pressed = null; apply(patch); }, delay || 220);
}
function resetAll() {
  busy = false; hideOv();
  var keepFlash = '';
  S = fresh(); S.flash = keepFlash;
  render();
}
function enterErgebnis() {
  S.result = findIdea(S.branche, S.baustelle, S.richtung);
  var r = runs();
  r.push({ zeit: new Date().toISOString(), rolle: S.rolle, welt: S.welt, branche: S.branche, baustelle: S.baustelle + 1, richtung: S.richtung,
    pfad_nr: S.result.nr, gezeigt_nr: S.result.idea.nr, gedruckt: 0, email: 0 });
  store.set(K_RUNS, r);
  S.runIdx = r.length - 1;
}
function markRun(field) {
  var r = runs(); if (S.runIdx >= 0 && r[S.runIdx]) { r[S.runIdx][field] = 1; store.set(K_RUNS, r); }
}

var screenEl = document.getElementById('screen');
function render() {
  var sc = S.screen, html;
  if (sc === 'start') html = scStart();
  else if (sc === 'name') html = scName();
  else if (STEP[sc]) html = scQuestion();
  else if (sc === 'ergebnis') html = scErgebnis();
  else if (sc === 'druck') html = scDruck();
  else if (sc === 'danke') html = scDanke();
  else if (sc === 'admin') html = scAdmin();
  else html = scStart();
  screenEl.innerHTML = html;
  document.body.classList.toggle('dark', sc === 'start' || sc === 'danke');
  if (sc === 'ergebnis') { var ec = document.getElementById('ergcard'); if (ec) fitCard(ec); if (settings.print && druckweg() === 'teilen') prepareShot(S.result.idea, S.rolle, S.name); }
  if (sc === 'admin' && druckweg() === 'teilen') prepareShot(BY_NR[SAMPLE_NR] || IDEEN[0], 'angestellt', 'Melanie');
  if (sc === 'druck') wireForm();
  if (sc === 'name') wireName();
}

/* ---------- Aktionen ---------- */
var pickers = {
  rolle: function (v, d) { press('rolle:' + v, { rolle: v, screen: 'welt' }, d); },
  welt: function (v, d) { var same = v === S.welt; press('welt:' + v, { welt: v, branche: same ? S.branche : null, baustelle: same ? S.baustelle : null, richtung: same ? S.richtung : null, screen: 'branche' }, d); },
  branche: function (v, d) { var same = v === S.branche; press('branche:' + v, { branche: v, baustelle: same ? S.baustelle : null, richtung: same ? S.richtung : null, screen: 'baustelle' }, d); },
  baustelle: function (v, d) { v = parseInt(v, 10); press('baustelle:' + v, { baustelle: v, screen: 'richtung' }, d); },
  richtung: function (v, d) { press('richtung:' + v, { richtung: v, screen: 'ergebnis' }, d); }
};
function optionsFor(sc) {
  if (sc === 'rolle') return ROLLEN.map(function (r) { return r.id; });
  if (sc === 'welt') return WELTEN.map(function (w) { return w.id; });
  if (sc === 'branche') return (byId(WELTEN, S.welt) || WELTEN[0]).branchen.slice();
  if (sc === 'baustelle') return ['0', '1', '2', '3'];
  if (sc === 'richtung') return RI.slice();
  return [];
}
var logoTaps = [];
function download(name, text, type) {
  try {
    var b = new Blob([text], { type: type || 'text/csv;charset=utf-8' });
    var u = URL.createObjectURL(b);
    var a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(u); a.remove(); }, 1500);
  } catch (e) {}
}
function csv(rows, cols) {
  function q(v) { v = v == null ? '' : String(v); if (/^[=+\-@]/.test(v)) v = "'" + v; return /[";\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  return [cols.join(';')].concat(rows.map(function (r) { return cols.map(function (c) { return q(r[c]); }).join(';'); })).join('\r\n');
}
var MAIL_COLS = ['zeit', 'vorname', 'email', 'kontakt', 'gezeigt_nr', 'idee', 'rolle', 'branche', 'baustelle', 'richtung', 'pfad_nr', 'testmodus'];
var RUN_COLS = ['zeit', 'rolle', 'welt', 'branche', 'baustelle', 'richtung', 'pfad_nr', 'gezeigt_nr', 'gedruckt', 'email'];
function stamp() { var d = new Date(); return d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2) + '-' + ('0' + d.getHours()).slice(-2) + ('0' + d.getMinutes()).slice(-2); }
function flash(t) { S.flash = t; render(); setTimeout(function () { if (S.flash === t) { S.flash = ''; if (S.screen === 'admin') render(); } }, 2500); }
function doPrint(i, role, name) {
  fillPrint(i, role, name);
  if (settings.print) { try { window.print(); } catch (e) {} }
}
/* ---------- Druck als Bild über «Teilen → Drucken» (iPad: ohne Kopf-/Fusszeile, Format vom Drucker) ---------- */
var shot = { key: '', file: null, pending: null };
function shotKey(i, role, name) { return i.nr + '|' + role + '|' + (name || ''); }
function shotReady(i, role, name) { return shot.key === shotKey(i, role, name) && !!shot.file; }
function canShareFiles() {
  try { if (!navigator.canShare || !window.File) return false; return navigator.canShare({ files: [new File(['x'], 'test.png', { type: 'image/png' })] }); } catch (e) { return false; }
}
function druckweg() {
  if (settings.weg === 'browser') return 'browser';
  if (settings.weg === 'teilen') return 'teilen';
  return (canShareFiles() && typeof html2canvas === 'function') ? 'teilen' : 'browser';
}
function prepareShot(i, role, name) {
  var key = shotKey(i, role, name);
  if (shot.key === key && (shot.file || shot.pending)) return shot.pending || Promise.resolve(shot.file);
  shot = { key: key, file: null, pending: null };
  if (typeof html2canvas !== 'function') return Promise.resolve(null);
  var box = document.getElementById('shot');
  box.innerHTML = cardHTML(i, role, name); fitCard(box);
  var ready = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  var p = ready.then(function () {
    return html2canvas(box.querySelector('.karte'), { scale: 3, backgroundColor: '#FFFFFF', logging: false,
      onclone: function (doc) { var c = doc.getElementById('shot'); if (c) { c.style.visibility = 'visible'; c.style.left = '0px'; c.style.top = '0px'; } } });
  }).then(function (canvas) {
    return new Promise(function (res) { canvas.toBlob(function (b) { res(b); }, 'image/png'); });
  }).then(function (blob) {
    if (shot.key !== key) return null;
    shot.pending = null;
    if (!blob) return null;
    shot.file = new File([blob], 'Ideenkarte-' + pad3(i.nr) + '.png', { type: 'image/png' });
    if (S.screen === 'ergebnis' || S.screen === 'admin') render();
    return shot.file;
  }).catch(function () { if (shot.key === key) shot.pending = null; return null; });
  shot.pending = p;
  return p;
}
function shareShot(onDone, onFail) {
  try {
    navigator.share({ files: [shot.file], title: 'Ideenkarte' }).then(function () { if (onDone) onDone(); })
      .catch(function (e) { if (e && e.name === 'AbortError') return; if (onFail) onFail(); });
    return true;
  } catch (e) { return false; }
}

var actions = {
  logo: function () {
    var n = Date.now(); logoTaps = logoTaps.filter(function (t) { return n - t < 3000; }); logoTaps.push(n);
    if (logoTaps.length >= 5) { logoTaps = []; S = fresh(); S.screen = 'admin'; render(); }
  },
  start: function () { if (!guard()) return; var c = counter(); c.gestartet = (c.gestartet || 0) + 1; store.set(K_CNT, c); apply({ screen: 'name' }); var n = document.getElementById('vorname'); if (n) { try { n.focus(); } catch (e) {} } },
  noname: function () { var n = document.getElementById('vorname'); if (n) n.blur(); go({ screen: 'rolle', name: '' }); },
  pick: function (v) { var f = pickers[S.screen]; if (f) f(v, 0); },
  dice: function () { var o = optionsFor(S.screen); var f = pickers[S.screen]; if (f && o.length) f(o[Math.floor(Math.random() * o.length)], 650); },
  back: function () { go({ screen: PREV[S.screen] || 'start' }); },
  crumb: function (v) { go({ screen: v }); },
  again: function () { go({ screen: 'rolle', rolle: null, welt: null, branche: null, baustelle: null, richtung: null, result: null, runIdx: -1 }); },
  print: function () {
    if (!guard()) return;
    if (!settings.print) { apply({ screen: 'druck', err: '' }); return; }
    if (druckweg() === 'teilen') {
      if (!shotReady(S.result.idea, S.rolle, S.name)) { prepareShot(S.result.idea, S.rolle, S.name); return; }
      var weiter = function () { markRun('gedruckt'); apply({ screen: 'druck', err: '' }); };
      var res = S.result;
      if (shareShot(weiter, function () { doPrint(res.idea, S.rolle, S.name); weiter(); })) return;
    }
    doPrint(S.result.idea, S.rolle, S.name);
    markRun('gedruckt');
    apply({ screen: 'druck', err: '' });
  },
  nein: function () { go({ screen: 'danke', sent: false }); },
  home: function () { if (!guard()) return; resetAll(); },
  dom: function () {},
  set: function (v, el) {
    var k = el.getAttribute('data-k');
    settings[k] = (k === 'idle') ? parseInt(v, 10) : (v === 'true' ? true : v === 'false' ? false : v);
    saveSettings(); render();
  },
  step: function (v, el) {
    var k = el.getAttribute('data-k');
    settings[k] = Math.max(-6, Math.min(6, Math.round((settings[k] + parseFloat(v)) * 2) / 2));
    saveSettings(); render();
  },
  testprint: function () {
    var i = BY_NR[SAMPLE_NR] || IDEEN[0];
    if (druckweg() === 'teilen') {
      if (!shotReady(i, 'angestellt', 'Melanie')) { prepareShot(i, 'angestellt', 'Melanie'); flash('Testkarte wird vorbereitet – gleich nochmals tippen'); return; }
      if (shareShot()) return;
    }
    fillPrint(i, 'angestellt', 'Melanie'); try { window.print(); } catch (e) {}
  },
  dl: function (v) {
    if (v === 'mails') download('ideenkarte-emails-' + stamp() + '.csv', '﻿' + csv(mails(), MAIL_COLS));
    else download('ideenkarte-durchlaeufe-' + stamp() + '.csv', '﻿' + csv(runs(), RUN_COLS));
    flash('Export gestartet');
  },
  mailto: function () {
    var body = csv(mails(), MAIL_COLS);
    try { window.location.href = 'mailto:?subject=' + encodeURIComponent('Ideenkarte · E-Mails ' + stamp()) + '&body=' + encodeURIComponent(body); } catch (e) {}
  },
  showcsv: function () {
    S.showCsv = S.showCsv ? '' : csv(mails(), MAIL_COLS); render();
    var t = document.getElementById('csvbox'); if (t) { t.focus(); t.select(); }
  },
  wipe: function () {
    if (!S.armWipe) { S.armWipe = true; render(); setTimeout(function () { if (S.armWipe) { S.armWipe = false; if (S.screen === 'admin') render(); } }, 4000); return; }
    store.set(K_MAIL, []); store.set(K_RUNS, []); store.set(K_CNT, { gestartet: 0 });
    S.armWipe = false; S.showCsv = ''; flash('Alle Daten gelöscht');
  }
};

screenEl.addEventListener('click', function (e) {
  var el = e.target.closest('[data-a]'); if (!el) return;
  var a = el.getAttribute('data-a'); var f = actions[a]; if (f) f(el.getAttribute('data-v'), el);
});
/* Domain-Chips: Tastatur offen lassen */
screenEl.addEventListener('pointerdown', function (e) {
  var el = e.target.closest('[data-a="dom"]'); if (!el) return;
  e.preventDefault();
  var inp = document.getElementById('mail'); if (!inp) return;
  var v = inp.value.trim(), d = el.getAttribute('data-v');
  inp.value = (v.indexOf('@') >= 0 ? v.slice(0, v.indexOf('@')) : v) + d;
  S.mail = inp.value; clearErr();
});

function wireName() {
  var f = document.getElementById('nameform'), inp = document.getElementById('vorname');
  var g = document.querySelector('#nmcard .k-gruss');
  inp.addEventListener('input', function () { g.innerHTML = grussHTML(cleanName(inp.value)); });
  inp.addEventListener('blur', function () { setTimeout(function () { if (document.activeElement !== inp) { window.scrollTo(0, 0); fit(); } }, 60); });
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!guard()) return;
    var n = cleanName(inp.value);
    inp.blur();
    apply({ screen: 'rolle', name: n });
  });
}
var MAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function clearErr() { if (!S.err) return; S.err = ''; var i = document.getElementById('mail'), e = document.getElementById('mailerr'); if (i) i.classList.remove('bad'); if (e) e.textContent = ''; }
function wireForm() {
  var f = document.getElementById('mailform'), inp = document.getElementById('mail'), ck = document.getElementById('kontakt'), dr = document.getElementById('druck');
  inp.addEventListener('input', function () { S.mail = inp.value; clearErr(); });
  ck.addEventListener('change', function () { S.kontakt = ck.checked; });
  inp.addEventListener('focus', function () { dr.classList.add('kb'); });
  inp.addEventListener('blur', function () { setTimeout(function () { if (document.activeElement !== inp) { dr.classList.remove('kb'); window.scrollTo(0, 0); fit(); } }, 60); });
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = inp.value.trim().replace(/\s+/g, '');
    if (!v) { S.err = 'Bitte gib deine E-Mail-Adresse ein.'; }
    else if (!MAIL_RE.test(v)) { S.err = 'Bitte prüfe die Adresse.'; }
    if (S.err) { var er = document.getElementById('mailerr'); er.textContent = S.err; inp.classList.add('bad'); return; }
    if (!guard()) return;
    var r = S.result, i = r.idea;
    var list = mails();
    list.push({ zeit: new Date().toISOString(), vorname: S.name, email: v, kontakt: ck.checked ? 'ja' : 'nein', gezeigt_nr: pad3(i.nr), idee: i.name, rolle: S.rolle,
      branche: S.branche, baustelle: S.baustelle + 1, richtung: S.richtung, pfad_nr: pad3(r.nr), testmodus: r.exact ? 'nein' : 'ja' });
    store.set(K_MAIL, list);
    markRun('email');
    inp.blur();
    apply({ screen: 'danke', sent: true, mail: '', kontakt: false });
  });
}

/* ---------- Leerlauf ---------- */
var lastAct = Date.now(), ov = document.getElementById('ov'), ovn = document.getElementById('ovn');
function hideOv() { ov.hidden = true; }
['pointerdown', 'keydown', 'input', 'touchstart'].forEach(function (ev) {
  document.addEventListener(ev, function () { lastAct = Date.now(); }, { capture: true, passive: true });
});
ov.addEventListener('click', function (e) { e.stopPropagation(); lastAct = Date.now(); hideOv(); });
setInterval(function () {
  var sc = S.screen; if (sc === 'start' || sc === 'admin') { hideOv(); return; }
  var idle = (Date.now() - lastAct) / 1000;
  if (sc === 'danke') { if (idle > 12) resetAll(); return; }
  var lim = settings.idle || 60;
  if (idle > lim + 10) { resetAll(); return; }
  if (idle > lim) { ov.hidden = false; ovn.textContent = String(Math.max(1, Math.ceil(lim + 10 - idle))); }
  else if (!ov.hidden) hideOv();
}, 250);
document.addEventListener('touchstart', function () {}, { passive: true });

/* ---------- Skalierung ---------- */
var stage = document.getElementById('stage'), app = document.getElementById('app');
function fit() {
  var ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return;
  var w = app.clientWidth, h = app.clientHeight;
  var cs = getComputedStyle(app);
  w -= parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  h -= parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  if (!(w > 50) || !(h > 50)) return;
  var s = Math.min(w / 1180, h / 820);
  stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  stage.style.left = (parseFloat(cs.paddingLeft) + w / 2) + 'px';
  stage.style.top = (parseFloat(cs.paddingTop) + h / 2) + 'px';
}
window.addEventListener('resize', fit);
window.addEventListener('afterprint', function () { setTimeout(fit, 50); });
window.addEventListener('hashchange', function () { if (/#admin/.test(location.hash)) { S = fresh(); S.screen = 'admin'; render(); } });
window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });

applyOffset();
render();
fit();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (S.screen === 'ergebnis') render(); });
if (/#admin/.test(location.hash)) { S.screen = 'admin'; render(); }
window.__ik = { prepareShot: prepareShot, druckweg: druckweg, cleanName: cleanName, S: function () { return S; }, set: function (p) { apply(p); }, cardHTML: cardHTML, fitCard: fitCard, IDEEN: IDEEN, findIdea: findIdea, fillPrint: fillPrint, settings: settings };
})();
</script>

try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
